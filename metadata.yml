Status: Ready
Title: MeSH therapeutic use based on chemical structure
Description: Assigns a molecule to twelve broad therapeutic categories taken 
  from the MeSH therapeutic use vocabulary, inferring likely clinical purpose 
  straight from structure. Meyer and colleagues gathered 6955 PubChem compounds 
  each falling in exactly one of the twelve classes, reaching 83 to 88 percent 
  accuracy with convolutional networks on molecule images and random forests on 
  Morgan fingerprints. Ersilia replicates the task with twelve independent 
  binary classifiers, so several categories can score highly for one compound 
  even though the training labels were exclusive.
